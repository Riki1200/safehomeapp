<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2540"/>
      <stop offset="0.55" stop-color="#0B4F6C"/>
      <stop offset="1" stop-color="#0E9F7E"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B4F6C"/>
      <stop offset="1" stop-color="#0E9F7E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#021526" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Full-bleed square: iOS applies its own mask; no transparency, no pre-rounded corners -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- House-shield: roof on top, shield point at the bottom -->
  <path filter="url(#shadow)" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="28" stroke-linejoin="round"
        d="M512 200 L752 372 L752 560 C752 694 648 784 512 838 C376 784 272 694 272 560 L272 372 Z"/>
  <!-- Chimney -->
  <rect x="660" y="262" width="56" height="96" rx="10" fill="#FFFFFF"/>
  <!-- Verified check -->
  <path d="M404 546 L482 622 L628 462" fill="none" stroke="#0E8C72" stroke-width="66"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Gold accent: verification seal dot -->
  <circle cx="512" cy="330" r="22" fill="#F5B841"/>
</svg>
